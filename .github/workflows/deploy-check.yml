name: PCFORGE deployment check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4
        with:
          path: PCFORGE-deploy

      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: sinyavskiy252-jpg/PCsait
          ref: main
          path: PCsait

      - name: Validate Compose configuration
        run: docker compose --env-file PCsait/.env.example -f PCFORGE-deploy/compose.yaml config

      - name: Build PCFORGE image
        run: docker compose --env-file PCsait/.env.example -f PCFORGE-deploy/compose.yaml build
